name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config tcl-dev
      - name: Build
        run: make
      - name: Check
        run: make check

  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config tcl-dev
      - name: Build with ASan and UBSan
        run: make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Check with ASan and UBSan
        run: make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check


  standalone-contract:
    runs-on: ubuntu-latest
    env:
      TICLE_PBMP_SOCKET: ""
      TICLE_BOTWEB_URL: ""
      TICLE_BOTAI_URL: ""
      TICLE_BOTLOGIC_URL: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config tcl-dev
      - name: Qualify standalone core with all integrations disabled
        run: |
          test -z "$TICLE_PBMP_SOCKET"
          test -z "$TICLE_BOTWEB_URL"
          test -z "$TICLE_BOTAI_URL"
          test -z "$TICLE_BOTLOGIC_URL"
          make
          make check

  pbmp-conformance:
    runs-on: ubuntu-latest
    env:
      TICLE_PBMP_SOCKET: /tmp/ticle.pbmp.sock
    steps:
      - uses: actions/checkout@v4
      - name: Build qualification endpoint
        run: make tests/pbmp_qualification
      - name: Start TiCle PBMP qualification endpoint
        run: |
          ./tests/pbmp_qualification &
          for i in {1..50}; do
            test -S "$TICLE_PBMP_SOCKET" && exit 0
            sleep 0.1
          done
          exit 1
      - name: Check out PBMP qualification suite
        uses: actions/checkout@v4
        with:
          repository: Ploos-AS/PBMP
          ref: v1.0.0
          path: .pbmp-suite
      - name: Qualify TiCle against PBMP/1
        run: |
          python3 .pbmp-suite/tools/qualify_endpoint.py \
            --socket "$TICLE_PBMP_SOCKET" \
            --implementation-name ticle \
            --implementation-version "$GITHUB_SHA" \
            --output ticle-pbmp-conformance.json
          python3 -c 'import json; r=json.load(open("ticle-pbmp-conformance.json")); assert r["result"] == "pass"'
      - name: Upload PBMP conformance report
        uses: actions/upload-artifact@v4
        with:
          name: ticle-pbmp-v1.0.0-conformance
          path: ticle-pbmp-conformance.json
          if-no-files-found: error
